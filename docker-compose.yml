services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moment
      POSTGRES_PASSWORD: moment
      POSTGRES_DB: moment
    ports:
      - "5432:5432"
    volumes:
      - moment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moment"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  moment_data:
